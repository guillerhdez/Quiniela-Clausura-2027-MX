name: Probar contraste de fuentes

# Solo lectura (ESPN vs TheSportsDB). Sin secrets ni escritura. Se lanza a mano.
on:
  workflow_dispatch:
    inputs:
      rondas:
        description: 'Rondas (Jornadas) a comparar, separadas por coma'
        type: string
        default: '15,16'

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Contrastar ESPN y TheSportsDB
        env:
          RONDAS: ${{ inputs.rondas }}
        run: node scripts/probar-contraste.js
